<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
<title id="t">How InvoiceChaser works</title>
<desc id="d">You add an invoice. The agent reads it and drafts an email. You approve it and it sends from your Gmail with send-only access. The client replies, the reply comes back through Resend Inbound, the agent reads it, and you pick the next step, such as escalating. The loop repeats until the invoice is paid.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C9B8A6"/></marker>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .pulse, .ring { display: none; } }
  </style>
</defs>
<rect width="960" height="470" rx="20" fill="#FFF7F0"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#111827">How InvoiceChaser works</text>
<text x="920" y="52" font-size="14" text-anchor="end" fill="#6B7280">You do 3 things. The agent does the rest.</text>
<line x1="236" y1="135.0" x2="264" y2="135.0" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="466" y1="135.0" x2="494" y2="135.0" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="696" y1="135.0" x2="724" y2="135.0" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="825.0" y1="184" x2="825.0" y2="266" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="724" y1="315.0" x2="696" y2="315.0" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="494" y1="315.0" x2="466" y2="315.0" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="264" y1="315.0" x2="236" y2="315.0" stroke="#C9B8A6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M135.0 266 V225.0 H595.0 V186" fill="none" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="365.0" y="217.0" font-size="13" text-anchor="middle" fill="#6B7280">repeat until paid</text>
<circle class="pulse" r="7" fill="#FF6B35" stroke="#FFFFFF" stroke-width="2.5"><animateMotion dur="16s" repeatCount="indefinite" path="M135.0 135.0 H825.0 V315.0 H135.0"/></circle>
<rect x="40" y="92" width="190" height="86" rx="14" fill="#FF6B35" stroke="#FF6B35" stroke-width="1.5"/>
<rect class="ring" x="35" y="87" width="200" height="96" rx="18" fill="none" stroke="#111827" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.06;0.09;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="56" y="118" font-size="12" font-weight="600" fill="#111827">You</text>
<text x="56" y="142" font-size="16" font-weight="700" fill="#111827">1  Add the invoice</text>
<text x="56" y="162" font-size="13" fill="#111827">PDF, DOCX, or create one</text>
<rect x="270" y="92" width="190" height="86" rx="14" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<rect class="ring" x="265" y="87" width="200" height="96" rx="18" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.122;0.147;0.207;0.237;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="286" y="118" font-size="12" font-weight="600" fill="#D1D5DB">Agent</text>
<text x="286" y="142" font-size="16" font-weight="700" fill="#FFFFFF">Reads the PDF</text>
<text x="286" y="162" font-size="13" fill="#D1D5DB">client, amount, due date</text>
<rect x="500" y="92" width="190" height="86" rx="14" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<rect class="ring" x="495" y="87" width="200" height="96" rx="18" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.270;0.295;0.355;0.385;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="516" y="118" font-size="12" font-weight="600" fill="#D1D5DB">Agent</text>
<text x="516" y="142" font-size="16" font-weight="700" fill="#FFFFFF">Drafts the email</text>
<text x="516" y="162" font-size="13" fill="#D1D5DB">friendly, formal or legal</text>
<rect x="730" y="92" width="190" height="86" rx="14" fill="#FF6B35" stroke="#FF6B35" stroke-width="1.5"/>
<rect class="ring" x="725" y="87" width="200" height="96" rx="18" fill="none" stroke="#111827" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.417;0.442;0.502;0.532;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="746" y="118" font-size="12" font-weight="600" fill="#111827">You</text>
<text x="746" y="142" font-size="16" font-weight="700" fill="#111827">2  Approve it</text>
<text x="746" y="162" font-size="13" fill="#111827">edit or reject if needed</text>
<rect x="730" y="272" width="190" height="86" rx="14" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<rect class="ring" x="725" y="267" width="200" height="96" rx="18" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.533;0.558;0.618;0.648;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="746" y="298" font-size="12" font-weight="600" fill="#D1D5DB">Agent</text>
<text x="746" y="322" font-size="16" font-weight="700" fill="#FFFFFF">Sends from Gmail</text>
<text x="746" y="342" font-size="13" fill="#D1D5DB">your address, send-only</text>
<rect x="500" y="272" width="190" height="86" rx="14" fill="#FFFFFF" stroke="#F1E4D8" stroke-width="1.5"/>
<rect class="ring" x="495" y="267" width="200" height="96" rx="18" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.680;0.705;0.765;0.795;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="516" y="298" font-size="12" font-weight="600" fill="#6B7280">Client</text>
<text x="516" y="322" font-size="16" font-weight="700" fill="#111827">Client replies</text>
<text x="516" y="342" font-size="13" fill="#6B7280">to you + a reply address</text>
<rect x="270" y="272" width="190" height="86" rx="14" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<rect class="ring" x="265" y="267" width="200" height="96" rx="18" fill="none" stroke="#FF6B35" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.828;0.853;0.913;0.943;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="286" y="298" font-size="12" font-weight="600" fill="#D1D5DB">Agent</text>
<text x="286" y="322" font-size="16" font-weight="700" fill="#FFFFFF">Reads the reply</text>
<text x="286" y="342" font-size="13" fill="#D1D5DB">via Resend Inbound</text>
<rect x="40" y="272" width="190" height="86" rx="14" fill="#FF6B35" stroke="#FF6B35" stroke-width="1.5"/>
<rect class="ring" x="35" y="267" width="200" height="96" rx="18" fill="none" stroke="#111827" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.955;0.985;1" dur="16s" repeatCount="indefinite"/></rect>
<text x="56" y="298" font-size="12" font-weight="600" fill="#111827">You</text>
<text x="56" y="322" font-size="16" font-weight="700" fill="#111827">3  Pick the next step</text>
<text x="56" y="342" font-size="13" fill="#111827">escalate, or wait</text>
<rect x="40" y="408" width="14" height="14" rx="4" fill="#FF6B35"/><text x="62" y="420" font-size="13" fill="#111827">You</text>
<rect x="110" y="408" width="14" height="14" rx="4" fill="#111827"/><text x="132" y="420" font-size="13" fill="#111827">Agent</text>
<rect x="190" y="408" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#F1E4D8"/><text x="212" y="420" font-size="13" fill="#111827">Client</text>
<text x="920" y="420" font-size="13" text-anchor="end" fill="#6B7280">Nothing sends without your approval. Escalating is always your call.</text>
</svg>
